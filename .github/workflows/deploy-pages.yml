name: Publish TLDRM

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. Run in both possible New York hours and let the
    # first step keep only the invocation that is actually 9:30 a.m. ET.
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tldrm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.market_open.outputs.run }}
    steps:
      - name: Check weekday market-open window
        id: market_open
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=America/New_York date +%H:%M)" == "09:35" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.market_open.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Node
        if: steps.market_open.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.market_open.outputs.run == 'true'
        run: npm ci

      - name: Set project path
        if: steps.market_open.outputs.run == 'true'
        run: echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"

      - name: Verify and build static site
        if: steps.market_open.outputs.run == 'true'
        run: npm run verify

      - name: Configure Pages
        if: steps.market_open.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.market_open.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
