name: Publish TLDRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tldrm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.market_open.outputs.run }}
    steps:
      - name: Accept scheduled or requested publication
        id: market_open
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out source
        if: steps.market_open.outputs.run == 'true'
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        if: steps.market_open.outputs.run == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.market_open.outputs.run == 'true'
        run: npm ci

      - name: Install browser test runtime
        if: steps.market_open.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Set project path
        if: steps.market_open.outputs.run == 'true'
        run: echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"

      - name: Verify and build static site safely
        if: steps.market_open.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          npm run verify > "$RUNNER_TEMP/verify.log" 2>&1
          verify_status=$?
          node scripts/scan-ci-log.mjs "$RUNNER_TEMP/verify.log"
          log_status=$?
          if [[ "$log_status" -eq 0 ]]; then
            sed -n '1,240p' "$RUNNER_TEMP/verify.log"
          fi
          if [[ "$verify_status" -ne 0 || "$log_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Scan full Git history with Gitleaks
        if: steps.market_open.outputs.run == 'true'
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --no-banner --redact

      - name: Scan publish output with Gitleaks
        if: steps.market_open.outputs.run == 'true'
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo/publish --no-banner --redact

      - name: Check configured secret values without exposing them
        if: steps.market_open.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: node scripts/security-check.mjs

      - name: Upload Pages artifact
        if: steps.market_open.outputs.run == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: publish

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install verification runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run outsider check against deployed site
        env:
          OUTSIDER_BASE_URL: https://tldrmacro.com
        run: node scripts/outsider-check.mjs
